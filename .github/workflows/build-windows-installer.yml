name: Build Windows Installer

on:
  push:
    branches:
      - claude/bom-generator-app-aKqO8
    paths-ignore:
      - 'dist-electron/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run electron:build:win -- --publish=never

      - name: Commit and push installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist-electron/*.exe dist-electron/*.exe.blockmap
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
            exit 0
          fi
          git commit -m "chore: update Windows installer build [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
